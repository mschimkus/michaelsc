  <style>
    :root {
      --bg: #f5f8f6;
      --surface: #ffffff;
      --muted: #56635b;

      --primary: #347f5c;
      --primary-dark: #24583f;
      --primary-light: #edf5f0;

      /* Slightly darker color for main titles */
      --title-dark: #1d4934;

      /* Shared 1px card outline */
      --card-border: #7f8b84;

      /* Shared card shadow */
      --card-shadow:
        0 5px 18px rgba(35, 65, 48, 0.14);

      --radius: 12px;
      --max-width: 1100px;
      --transition: 0.2s ease;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 1rem;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--primary-dark);
      font-family: "Public Sans", sans-serif;
      line-height: 1.6;
    }

    img {
      display: block;
      max-width: 100%;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(calc(100% - 2rem), var(--max-width));
      margin-inline: auto;
    }

    .site-header {
      padding-top: 0.5rem;
      padding-bottom: 1.2rem;
    }

    .header-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    .header-heading {
      flex-shrink: 0;
    }

    .header-title {
      color: var(--title-dark);
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.6rem;
    }

    .nav-link {
      display: inline-block;
      padding: 0.45rem 0.85rem;
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1px solid rgba(47, 111, 82, 0.09);
      border-radius: 999px;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.4;
      transition:
        background-color var(--transition),
        color var(--transition),
        transform var(--transition);
    }

    .nav-link:hover,
    .nav-link:focus,
    .nav-link:focus-visible,
    .nav-link.active {
      background: var(--primary);
      color: #ffffff;
      text-decoration: none;
      outline: none;
      transform: translateY(-1px);
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      padding-bottom: 0.75rem;
    }

    .section-group {
      display: flex;
      flex-direction: column;
    }

    .section-heading {
      margin-bottom: 0.2rem;
    }

    .section-title {
      color: var(--title-dark);
      font-size: 1.65rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }
